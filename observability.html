<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Observability · dbt × Perspective</title></head>
<body><main><header><div><a href="%BASE_URL%">← YAML boards</a><h1>Observability explorer</h1><p>DuckDB-Wasm · metrics → traces → logs</p></div><button id="reload-demo">Reload demo</button></header>
<section class="controls"><label>Import table<select id="import-table"><option>metrics</option><option>spans</option><option>logs</option></select><input id="data-file" type="file" accept=".json,.jsonl,.ndjson,.csv,.parquet,.duckdb,.db"></label><label>OTLP trace export<input id="otlp-file" type="file" accept=".json"></label><label>Trace ID<input id="trace-id" placeholder="trace-slow-001"></label><button id="open-trace">Open trace</button><button id="append-data">Append live sample</button></section>
<details id="yaml-panel" open><summary>dbt Charts YAML · source of every chart</summary>
<p>Edit queries, chart channels, titles, and layout. Applying YAML rebuilds the explorer from this document.</p>
<textarea id="explorer-yaml" aria-label="Observability board YAML" spellcheck="false"></textarea>
<div class="yaml-actions"><button id="apply-yaml">Apply YAML</button><button id="download-yaml">Download active YAML</button><button id="reset-yaml">Reset YAML</button><label>Load board YAML<input id="yaml-file" type="file" accept=".yaml,.yml"></label></div>
<p id="yaml-status" role="status"></p></details>
<p id="loader-status" role="status"></p><div id="observability-root"></div></main><script type="module" src="/src/observability-main.ts"></script></body></html>
